<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Número</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Verificador de Número</h1>
        <p>Digite um número inteiro para descobrir se ele é par ou ímpar.</p>

        <label for="numero">Número:</label>
        <input type="number" id="numero" step="1" placeholder="Ex.: 12">

        <button id="verificar">Verificar</button>

        <p id="resultado" class="resultado" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
